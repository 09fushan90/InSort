<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>InSort — адмінка</title>
<style>
:root{--bg:#f2f5f1;--card:#fff;--ink:#162016;--mut:#6a766a;--line:#dde5db;--g:#5a9e4d;--g2:#8fd17f;--dark:#33403a;--red:#c8453a;--amber:#e0a100;--blue:#3b78c9}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101412;--card:#1a201c;--ink:#eef3ec;--mut:#9aa89a;--line:#2a332d;--dark:#2c3a32}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.brand{font-weight:900;font-size:26px;letter-spacing:-.5px}.brand b{color:var(--g)}
h1{font-size:20px;margin:14px 0 4px}.sub{color:var(--mut);margin:0 0 18px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);padding:8px;cursor:pointer;font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--g2),var(--g));color:#10200c}
.btn.dark{background:var(--dark);color:#fff}.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:8px 12px;border-radius:10px;font-size:13px}
.btn.red{background:var(--red);color:#fff}.btn:disabled{opacity:.55;cursor:default}
.full{width:100%;margin-top:18px}
.err{color:var(--red);font-weight:700;margin-top:12px;min-height:20px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}header .sp{flex:1}
.tabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}.tab{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}.tab.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:700}.chip.on{border-color:var(--g);color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.num{font-weight:900}.mut{color:var(--mut);font-size:13px}
.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#fff}
.st.new{background:var(--amber)}.st.accepted{background:var(--blue)}.st.done{background:var(--g)}.st.cancelled{background:var(--red)}
.items{margin:10px 0;padding:0;list-style:none;border-top:1px solid var(--line)}.items li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{display:flex;gap:8px;margin-top:10px}.msg input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:26px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--mut);font-size:12px;text-transform:uppercase}td.n{text-align:right;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.empty{color:var(--mut);text-align:center;padding:30px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="login" id="loginView">
  <form class="box" id="loginForm" autocomplete="on">
    <div class="brand">In<b>Sort</b></div>
    <h1>Вхід в адмінку</h1>
    <p class="sub">Лише для власника магазину.</p>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" placeholder="email@example.com" required>
    <label for="pw">Пароль</label>
    <div class="pw"><input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" required><button type="button" id="eye">показати</button></div>
    <button class="btn full" id="go" type="submit">Увійти</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</div>

<div class="wrap" id="appView" hidden>
  <header>
    <div class="brand">In<b>Sort</b> <span class="mut" style="font-weight:600;font-size:14px">адмінка</span></div>
    <div class="sp"></div>
    <a class="btn dark sm" href="index.html#office" style="text-decoration:none">Редактор товарів</a>
    <a class="btn line sm" href="index.html" style="text-decoration:none">На сайт</a>
    <button class="btn line sm" id="logout">Вийти</button>
  </header>
  <div class="tabs"><button class="tab on" data-tab="orders">Замовлення</button><button class="tab" data-tab="stats">Статистика</button></div>
  <section id="tabOrders">
    <div class="filters" id="filters"></div>
    <div id="orders"></div>
  </section>
  <section id="tabStats" hidden></section>
</div>
<div class="toast" id="toast"></div>

<script>
/* Адреса двигуна. '' = двигун на тій самій адресі, що й ця сторінка. */
var ENGINE = 'https://insort-engine.onrender.com';
var TK = 'insort_admin_token_v1';   // той самий ключ, що й на сайті: після входу редактор товарів уже відкритий
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var money = function (n) { return (Number(n) || 0).toLocaleString('uk-UA') + ' грн'; };
var STATUS = { new: 'Нове', accepted: 'Прийнято', done: 'Виконано', cancelled: 'Скасовано' };
var ORDERS = [], filter = 'all';

function tok() { try { var o = JSON.parse(localStorage.getItem(TK) || 'null'); if (o && o.t && o.exp > Date.now()) return o.t; } catch (e) {} return ''; }
function setTok(t) { try { if (t) localStorage.setItem(TK, JSON.stringify({ t: t, exp: Date.now() + 11.5 * 3600e3 })); else localStorage.removeItem(TK); } catch (e) {} }
function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 2200); }

function api(method, path, body) {
  var h = {}; if (body !== undefined) h['Content-Type'] = 'application/json';
  if (tok()) h.Authorization = 'Bearer ' + tok();
  return fetch(ENGINE + path, { method: method, headers: h, body: body !== undefined ? JSON.stringify(body) : undefined }).then(function (r) {
    return r.text().then(function (t) {
      var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
      if (r.status === 401 && path.indexOf('/login') < 0) { setTok(''); show(false); throw new Error('Сеанс завершився. Увійдіть знову.'); }
      if (!r.ok) throw new Error((j && j.error) || 'Помилка ' + r.status);
      return j;
    });
  });
}

function show(auth) { $('loginView').hidden = auth; $('appView').hidden = !auth; if (auth) loadOrders(); }

$('eye').onclick = function () { var p = $('pw'); var s = p.type === 'password'; p.type = s ? 'text' : 'password'; this.textContent = s ? 'сховати' : 'показати'; };
$('loginForm').onsubmit = function (e) {
  e.preventDefault(); $('loginErr').textContent = ''; $('go').disabled = true; $('go').textContent = 'Заходимо…';
  api('POST', '/api/admin/login', { email: $('em').value.trim(), password: $('pw').value }).then(function (r) {
    setTok(r.token); $('pw').value = ''; show(true);
  }).catch(function (er) { $('loginErr').textContent = er.message; })
    .then(function () { $('go').disabled = false; $('go').textContent = 'Увійти'; });
};
$('logout').onclick = function () { setTok(''); show(false); };

document.querySelectorAll('.tab').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === b); });
    $('tabOrders').hidden = b.dataset.tab !== 'orders'; $('tabStats').hidden = b.dataset.tab !== 'stats';
    if (b.dataset.tab === 'stats') loadStats(); else loadOrders();
  };
});

/* ---------- замовлення ---------- */
function loadOrders() {
  $('orders').innerHTML = '<div class="empty">Завантаження…</div>';
  api('GET', '/api/admin/orders').then(function (list) { ORDERS = list || []; renderOrders(); })
    .catch(function (e) { $('orders').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}
function renderOrders() {
  var cnt = { all: ORDERS.length }; Object.keys(STATUS).forEach(function (k) { cnt[k] = ORDERS.filter(function (o) { return o.status === k; }).length; });
  $('filters').innerHTML = [['all', 'Усі']].concat(Object.keys(STATUS).map(function (k) { return [k, STATUS[k]]; })).map(function (f) {
    return '<button class="chip' + (filter === f[0] ? ' on' : '') + '" data-f="' + f[0] + '">' + f[1] + ' · ' + (cnt[f[0]] || 0) + '</button>';
  }).join('');
  $('filters').querySelectorAll('.chip').forEach(function (c) { c.onclick = function () { filter = c.dataset.f; renderOrders(); }; });
  var list = ORDERS.filter(function (o) { return filter === 'all' || o.status === filter; });
  if (!list.length) { $('orders').innerHTML = '<div class="empty">Замовлень немає</div>'; return; }
  $('orders').innerHTML = list.map(function (o) {
    var d = new Date(o.created_at || o.createdAt || 0).toLocaleString('uk-UA');
    var items = (o.items || []).map(function (i) { return '<li><span>' + esc(i.title) + ' × ' + i.qty + (i.article ? ' <span class="mut">(' + esc(i.article) + ')</span>' : '') + '</span><b>' + (i.price ? money(i.price * i.qty) : '') + '</b></li>'; }).join('');
    return '<div class="card" data-id="' + o.id + '"><div class="row"><div><span class="num">№ ' + esc(o.number) + '</span> <span class="st ' + esc(o.status) + '">' + esc(STATUS[o.status] || o.status) + '</span><div class="mut">' + esc(d) + '</div></div><div style="text-align:right"><b style="font-size:18px">' + money(o.total) + '</b></div></div>' +
      '<div style="margin-top:8px"><b>' + esc(o.customer) + '</b> · <a href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a>' + (o.email ? ' · ' + esc(o.email) : '') + '</div>' +
      (o.comment ? '<div class="mut" style="white-space:pre-line;margin-top:4px">' + esc(o.comment) + '</div>' : '') +
      '<ul class="items">' + items + '</ul>' +
      '<div class="acts">' + ['accepted', 'done', 'cancelled'].filter(function (s) { return s !== o.status; }).map(function (s) { return '<button class="btn sm ' + (s === 'cancelled' ? 'red' : s === 'done' ? '' : 'dark') + '" data-st="' + s + '">' + (s === 'accepted' ? 'Прийняти' : s === 'done' ? 'Виконано' : 'Скасувати') + '</button>'; }).join('') + '</div>' +
      (o.email ? '<div class="msg"><input placeholder="Повідомлення клієнту на пошту…" value="' + esc(o.message || '') + '"><button class="btn line sm" data-send="1">Надіслати</button></div>' : '') + '</div>';
  }).join('');
  $('orders').querySelectorAll('.card').forEach(function (card) {
    var id = card.dataset.id;
    card.querySelectorAll('[data-st]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.st === 'cancelled' && !confirm('Скасувати це замовлення?')) return;
        b.disabled = true;
        api('PUT', '/api/admin/orders/' + id, { status: b.dataset.st }).then(function () { toast('Статус змінено'); loadOrders(); }).catch(function (e) { toast(e.message); b.disabled = false; });
      };
    });
    var s = card.querySelector('[data-send]');
    if (s) s.onclick = function () {
      var t = card.querySelector('.msg input').value.trim(); if (!t) return;
      s.disabled = true;
      api('PUT', '/api/admin/orders/' + id, { message: t }).then(function () { toast('Повідомлення надіслано'); s.disabled = false; }).catch(function (e) { toast(e.message); s.disabled = false; });
    };
  });
}

/* ---------- статистика ---------- */
function loadStats() {
  var box = $('tabStats'); box.innerHTML = '<div class="empty">Завантаження…</div>';
  api('GET', '/api/admin/analytics').then(function (a) {
    var o = {}; (a.orders || []).forEach(function (r) { o[r.status] = r.c; });
    var total = (a.orders || []).reduce(function (s, r) { return s + r.c; }, 0);
    function tbl(list) { return list && list.length ? '<table>' + list.slice(0, 15).map(function (r) { return '<tr><td>' + esc(r.title) + (r.article ? ' <span class="mut">' + esc(r.article) + '</span>' : '') + '</td><td class="n">' + r.n + '</td></tr>'; }).join('') + '</table>' : '<div class="empty">Поки немає даних</div>'; }
    box.innerHTML = '<div class="grid"><div class="stat"><span class="mut">Товарів</span><b>' + a.totals.products + '</b></div><div class="stat"><span class="mut">Переглядів</span><b>' + a.totals.views + '</b></div><div class="stat"><span class="mut">Додавань у кошик</span><b>' + a.totals.cartAdds + '</b></div><div class="stat"><span class="mut">Замовлень</span><b>' + total + '</b></div><div class="stat"><span class="mut">Нових</span><b>' + (o.new || 0) + '</b></div></div>' +
      '<div class="two"><div class="card"><b>Найбільше переглядів</b>' + tbl(a.topViews) + '</div><div class="card"><b>Найчастіше в кошику</b>' + tbl(a.topCartAdds) + '</div></div>';
  }).catch(function (e) { box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}

show(!!tok());
</script>
</body>
</html>
